[versions]
# Toolchain pins match portal-wake.
agp = "9.4.1"
kotlin = "2.4.21"
# Bundles ktlint 1.8.0 (ADR 0001).
kotlinter = "5.7.0"
detekt = "2.0.0-alpha.6"
core = "1.13.1"
annotation = "1.6.0"
junit = "4.13.2"
androidx-test-runner = "1.7.0"
androidx-test-junit = "1.3.0"
# The ONNX Runtime the off-device cascade evaluation ran openWakeWord on (report §4.1). The JVM artifact backs the
# :cascade tests; the Android artifact ships in the app. Both expose the same ai.onnxruntime API.
onnxruntime = "1.19.2"

[libraries]
androidx-core = { group = "androidx.core", name = "core", version.ref = "core" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidx-test-runner" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-junit" }
onnxruntime-jvm = { group = "com.microsoft.onnxruntime", name = "onnxruntime", version.ref = "onnxruntime" }
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntime" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-lint = { id = "com.android.lint", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinter = { id = "org.jmailen.kotlinter", version.ref = "kotlinter" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
