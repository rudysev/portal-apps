name: shellcheck

# The superproject's shell scripts are the end-user installer in provisioning/, the git hook and the
# prototypes/ scripts; prototypes/jarvis-cascade's Gradle build has its own workflow. The submodules run their own CI.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Lints every shell script (*.sh, *.command, .githooks/*) with the runner's preinstalled shellcheck and the
  # repo's .shellcheckrc, the same check .githooks/pre-commit runs on staged files. Submodules aren't checked
  # out: each one lints its own scripts.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck --version
      - run: git ls-files -z '*.sh' '*.command' '.githooks/*' | xargs -0 --no-run-if-empty shellcheck
